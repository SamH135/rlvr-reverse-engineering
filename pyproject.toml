[project]
name = "rlvr-coding-env"
version = "0.1.0"
description = "A generated coding-agent RLVR environment."
readme = "README.md"
authors = [{ name = "Sam Heidler" }]
requires-python = ">=3.11"
dependencies = [
    "verifiers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/rlvr_coding_env",
    "src/bugfix",
    "src/keygen",
    "src/decompile",
    "src/formats",
]

[tool.uv.sources]
verifiers = { git = "https://github.com/PrimeIntellect-ai/verifiers", rev = "308619da69c2e918c6b7c96e68f746485a913dba" }

[dependency-groups]
dev = [
    "hypothesis==6.170.14",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
norecursedirs = [
    "outputs",
    "*.egg",
    ".*",
    "build",
    "dist",
    "node_modules",
    "venv",
]
markers = [
    "slow: multi-seed generation sweeps; run the full suite without -m filters",
]
